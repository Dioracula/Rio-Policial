function aimShot(){
 const P=player.position;
 const live=npcs.filter(n=>!n.dead&&!n.arrested&&!n.boarded&&!n.cop&&!n.custody&&n.mesh.visible&&Math.hypot(n.mesh.position.x-P.x,n.mesh.position.z-P.z)<70);

 if(aimOn){
  rc.setFromCamera({x:0,y:0},camera);
  const o=rc.ray.origin.clone(),d=rc.ray.direction.clone(),s0=(P.x-o.x)*d.x+(1.4-o.y)*d.y+(P.z-o.z)*d.z;
  for(const h of rc.intersectObjects(live.map(n=>n.mesh),true)){
   if(h.distance<s0-.4)continue;
   let ob=h.object;while(ob&&!live.some(n=>n.mesh===ob))ob=ob.parent;const n=ob&&live.find(q=>q.mesh===ob);
   if(n&&!blocked(P.x,P.z,h.point.x,h.point.z)){tgt=n;E=h.point.clone();part=h.object.userData.p||'b';break}}
  if(!tgt){ // ajuda mínima, só contra bandidos (nunca civis/reféns)
   let bd=.05;const v=new THREE.Vector3();
   for(const n of live){if(!(n.robber||n.kid||n.isSuspect)||n.hostage||n.hostageOf)continue;v.copy(n.mesh.position);v.y=1.3;v.project(camera);if(v.z>1)continue;

  if(!tgt){let t=80;if(d.y<-.001)t=Math.min(t,-o.y/d.y);
   for(let s=Math.max(s0,0);s<t;s+=.6){if(collidesH(o.x+d.x*s,o.z+d.z*s,.05)){t=s;break}}
   E=o.clone().addScaledVector(d,t);E.y=Math.max(.05,E.y)}
 }else{

  for(const n of live){const p=n.mesh.position,dx=p.x-P.x,dz=p.z-P.z,dd=Math.hypot(dx,dz);if(dd<1||dd>50||n.hostage||n.hostageOf)continue;

  if(!tgt){const fx=Math.sin(fy),fz=Math.cos(fy);let t=45;for(let s=1;s<=45;s+=.7){if(collidesH(P.x+fx*s,P.z+fz*s,.05)){t=s;break}}E=new THREE.Vector3(P.x+fx*t,1.4,P.z+fz*t)}

 return{tgt,part,E}}

function updRemotes(dt){

 for(let i=1;i<P.length;i++){const l=o[o.length-1];if(Math.hypot(P[i][0]-l[0],P[i][1]-l[1])>.5)o.push(P[i])}return o}
function stopShort(go,k){const n=go.length;if(n<2)return;const L=go[n-1],Q=go[n-2],d=Math.hypot(L[0]-Q[0],L[1]-Q[1]);if(d>k+1){L[0]-=(L[0]-Q[0])/d*k;L[1]-=(L[1]-Q[1])/d*k}}

  if(m<=0)break;if(d<=m){p.x=w[0];p.z=w[1];m-=d;o.i++}else{p.x+=dx/d*m;p.z+=dz/d*m;m=0}}return o.i>=o.wp.length}

 r.cleanup=()=>cancelAnimationFrame(raf);draw();const t=document.createElement('div');t.style.cssText='font-size:11px;text-align:center;color:#9fb0c3';t.textContent='Arraste a lupa e solte sobre as fibras coloridas. Cuidado com as sujeiras cinzas!';B.appendChild(t)}
function pzPick(B,o){const r=pzRun;let round=0,cur;const W=Math.round(Math.max(96,Math.min(150,(innerWidth-70)/Math.min(o.n,5)-8))),H=Math.round(W*.72);

  wrap.appendChild(mk(cur.sample,Math.round(W*1.4),Math.round(H*1.1)));const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;justify-content:center';wrap.appendChild(row);
  cur.cands.forEach(cd=>{const cv=mk(cd.d,W,H,()=>{if(r.over||cd.off)return;if(cd.ok){round++;cv.style.borderColor='#3cd070';if(round>=o.rounds)pzEnd(true);else setTimeout(show,350)}else{off(cd);cv.style.borderColor='#ff5a5a';pzMist()}});cd.cv=cv;row.appendChild(cv)});
  if(r.L>=2){const w=cur.cands.filter(x=>!x.ok);if(w.length>1)off(pick(w))}}
 r.hintFn=()=>{const w=cur.cands.filter(x=>!x.ok&&!x.off);if(w.length)off(pick(w))};show()}
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
function pzDna(B){const s=pzRun.s,diff=[3,2,1][s-1];
 const gen=()=>shuf([...Array(12).keys()]).slice(0,6).map(p=>({p,t:1+Math.floor(Math.random()*3)}));
 const mod=b=>{const c=b.map(x=>({...x})),idx=shuf(c.map((x,i)=>i)).slice(0,diff);idx.forEach(i=>{const q=c[i];if(Math.random()<.5){const np=q.p+(Math.random()<.5?1:-1);if(np>=0&&np<12&&!c.some(x=>x.p===np))q.p=np;else q.t=q.t===3?1:q.t+1}else q.t=q.t===3?1:q.t+1});return c};
 pzPick(B,{n:[3,4,5][s-1],rounds:[1,2,2][s-1],
  make(){const sm=gen(),cands=[{d:sm.map(x=>({...x})),ok:true}];for(let i=1;i<[3,4,5][s-1];i++)cands.push({d:mod(sm),ok:false});return{sample:sm,cands:shuf(cands)}},
  draw(g,d,w,h){g.fillStyle='#10161c';g.fillRect(0,0,w,h);g.fillStyle='#1b2a38';g.fillRect(w*.08,4,w*.84,h-8);d.forEach(q=>{g.fillStyle='#bfe6ff';g.fillRect(w*.14,6+q.p*((h-16)/12),w*.72,1+q.t*1.5)})}})}
function pzDig(B){const s=pzRun.s,dl=[.35,.2,.12][s-1];
 const gen=()=>({sp:5+Math.random()*2.2,ecc:.7+Math.random()*.5,rot:Math.random()*3,cx:(Math.random()-.5)*.2,cy:(Math.random()-.5)*.2,gp:[0,1,2].map(()=>({x:.25+Math.random()*.5,y:.25+Math.random()*.5}))});
 const mod=d=>{const c=JSON.parse(JSON.stringify(d)),a=Math.floor(Math.random()*5);if(a===0)c.sp*=1+dl*.6*(Math.random()<.5?1:-1);else if(a===1)c.ecc+=dl*(Math.random()<.5?1:-1);else if(a===2)c.rot+=dl*.9;else if(a===3){c.cx+=dl*.25;c.cy-=dl*.2}else{const q=pick(c.gp);q.x+=dl*.5*(Math.random()<.5?1:-1);q.y+=dl*.4}return c};
 pzPick(B,{n:[3,4,5][s-1],rounds:[1,2,2][s-1],
  make(){const sm=gen(),cands=[{d:sm,ok:true}];for(let i=1;i<[3,4,5][s-1];i++)cands.push({d:mod(sm),ok:false});return{sample:sm,cands:shuf(cands)}},
  draw(g,d,w,h){g.fillStyle='#10161c';g.fillRect(0,0,w,h);g.save();g.beginPath();g.ellipse(w/2,h/2,w*.4,h*.46,0,0,7);g.clip();g.fillStyle='#caa77a';g.fillRect(0,0,w,h);g.strokeStyle='#5b3a1e';g.lineWidth=1.2;
   const k=w/150;for(let i=1;i<40;i++){g.beginPath();g.ellipse(w/2+d.cx*w,h/2+d.cy*h,i*d.sp*d.ecc*k,i*d.sp*k,d.rot,0,7);g.stroke()}
   g.fillStyle='#caa77a';d.gp.forEach(q=>{g.beginPath();g.arc(q.x*w,q.y*h,3.2*k,0,7);g.fill()});g.restore()}})}

// Celular da vítima: memorize a sequência do padrão de desbloqueio e repita
function pzCel(B){const r=pzRun,len=[4,5,6][r.s-1],S=Math.round(Math.max(170,Math.min(270,Math.min(innerHeight-210,innerWidth*.8))));
 const seq=[];let last=-1;for(let i=0;i<len;i++){let k;do k=Math.floor(Math.random()*9);while(k===last);seq.push(k);last=k}
 const w=document.createElement('div');w.style.cssText=`display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:${S}px;height:${S}px;padding:12px;background:#10161c;border-radius:14px;border:2px solid #ffffff33;box-sizing:content-box`;
 const cells=[];for(let i=0;i<9;i++){const c=document.createElement('button');c.style.cssText='border-radius:50%;border:2px solid #ffffff44;background:#1b2a38;padding:0;touch-action:manipulation';w.appendChild(c);cells.push(c)}
 const t=document.createElement('div');t.style.cssText='font-size:12px;text-align:center;color:#9fb0c3;margin-top:4px';
 let pos=0,showing=true,timers=[];
 const flash=(i,col,ms)=>{cells[i].style.background=col;timers.push(setTimeout(()=>{cells[i].style.background='#1b2a38'},ms))};
 const play=()=>{showing=true;pos=0;timers.forEach(clearTimeout);timers=[];t.textContent='Memorize a sequência do desbloqueio…';
  seq.forEach((k,j)=>timers.push(setTimeout(()=>flash(k,'#ffe14a',420),500+j*700)));
  timers.push(setTimeout(()=>{showing=false;t.textContent='Agora repita tocando nos pontos na mesma ordem.'},500+len*700))};
 cells.forEach((c,i)=>c.onclick=()=>{if(r.over||showing)return;
  if(i===seq[pos]){flash(i,'#3cd070',250);pos++;if(pos>=len)pzEnd(true)}else{flash(i,'#ff5a5a',300);pzMist();if(!r.over)play()}});
 r.hintFn=()=>play();r.cleanup=()=>timers.forEach(clearTimeout);
 B.appendChild(w);B.appendChild(t);play()}
// Foto rasgada: toque em duas peças para trocá-las até remontar a imagem
function pzFoto(B){const r=pzRun,s=r.s,C=[3,3,4][s-1],R=[2,3,3][s-1],n=C*R,T=Math.round(Math.max(50,Math.min(86,Math.min(innerWidth*.9,330)/C,(innerHeight-230)/R))),W=C*T,H=R*T;
 const img=document.createElement('canvas');img.width=W;img.height=H;const g=img.getContext('2d');
 const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#d9c9a3');gr.addColorStop(1,'#a88f63');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='#3a2f20aa';for(let y=7;y<H-4;y+=9)g.fillRect(5,y,W*(.45+Math.random()*.5),3);
 for(let i=0;i<n;i++){const cx=(i%C)*T+T*(.28+Math.random()*.44),cy=Math.floor(i/C)*T+T*(.28+Math.random()*.44);g.fillStyle=`hsl(${(i*53+Math.random()*25)%360},72%,48%)`;g.beginPath();
  if(i%3===0)g.arc(cx,cy,T*.17,0,7);else if(i%3===1)g.rect(cx-T*.15,cy-T*.15,T*.3,T*.3);else{g.moveTo(cx,cy-T*.18);g.lineTo(cx+T*.18,cy+T*.14);g.lineTo(cx-T*.18,cy+T*.14)}g.fill()}
 let ord;do ord=shuf([...Array(n).keys()]);while(ord.filter((v,i)=>v===i).length>1);
 let sel=-1;const ok=()=>ord.filter((v,i)=>v===i).length;
 const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:6px';
 if(s===1||r.L>=2){const th=document.createElement('canvas');th.width=W;th.height=H;th.style.cssText=`width:${Math.round(W*.4)}px;height:${Math.round(H*.4)}px;border-radius:5px;border:1px solid #ffffff55`;th.getContext('2d').drawImage(img,0,0);wrap.appendChild(th)}
 const grid=document.createElement('div');grid.style.cssText=`display:grid;grid-template-columns:repeat(${C},${T}px);gap:2px`;wrap.appendChild(grid);
 const draw=()=>{grid.innerHTML='';ord.forEach((id,i)=>{const cv=document.createElement('canvas');cv.width=cv.height=T;cv.style.cssText=`width:${T}px;height:${T}px;border:2px solid ${i===sel?'#ffe14a':id===i?'#3cd070':'#ffffff33'};box-sizing:border-box;border-radius:3px`;
  cv.getContext('2d').drawImage(img,(id%C)*T,Math.floor(id/C)*T,T,T,0,0,T,T);cv.onclick=()=>pick2(i);grid.appendChild(cv)})};
 const swap=(a,b)=>{const t=ord[a];ord[a]=ord[b];ord[b]=t};
 function pick2(i){if(r.over)return;if(sel<0){sel=i;draw();return}if(sel===i){sel=-1;draw();return}
  const before=ok();swap(sel,i);sel=-1;draw();if(ok()===n){pzEnd(true);return}if(ok()<before)pzMist()}
 r.hintFn=()=>{const i=ord.findIndex((v,k)=>v!==k);if(i<0)return;const j=ord.indexOf(i);swap(i,j);sel=-1;draw();if(ok()===n)pzEnd(true)};
 const t=document.createElement('div');t.style.cssText='font-size:11px;text-align:center;color:#9fb0c3';t.textContent='Toque em duas peças para trocá-las e remontar a foto rasgada. Tirar uma peça certa do lugar conta como erro.';
 B.appendChild(wrap);B.appendChild(t);draw()}
// Toxicologia: toque quando o marcador estiver na faixa verde
function pzTox(B){const r=pzRun,s=r.s,need=[3,4,5][s-1],S=Math.round(Math.max(220,Math.min(320,innerWidth*.88))),Hh=76,spd=[.9,1.2,1.6][s-1];
 let zw=[.22,.15,.1][s-1]*(r.L>=2?1.25:1);
 const c=document.createElement('canvas');c.width=S*2;c.height=Hh*2;c.style.cssText=`width:${S}px;height:${Hh}px;border-radius:10px;border:2px solid #ffffff44;touch-action:manipulation`;B.appendChild(c);
 const g=c.getContext('2d');g.scale(2,2);
 let hits=0,zc=.3+Math.random()*.4,t0=performance.now(),raf=0,fl=0,fc='#3cd070';
 const pos=()=>.5+.5*Math.sin((performance.now()-t0)/1000*spd*Math.PI*1.2);
 function draw(){g.fillStyle='#10161c';g.fillRect(0,0,S,Hh);g.fillStyle='#1b2a38';g.fillRect(10,26,S-20,18);
  g.fillStyle='#3cd07099';g.fillRect(10+(zc-zw/2)*(S-20),22,zw*(S-20),26);
  g.fillStyle='#ffe14a';g.fillRect(10+pos()*(S-20)-2,14,4,42);
  for(let i=0;i<need;i++){g.fillStyle=i<hits?'#3cd070':'#ffffff33';g.beginPath();g.arc(S/2-(need-1)*10+i*20,Hh-8,5,0,7);g.fill()}
  if(performance.now()<fl){g.fillStyle=fc+'33';g.fillRect(0,0,S,Hh)}
  raf=requestAnimationFrame(draw)}
 c.addEventListener('pointerdown',e=>{e.preventDefault();if(r.over)return;fl=performance.now()+180;
  if(Math.abs(pos()-zc)<=zw/2){fc='#3cd070';hits++;zc=.2+Math.random()*.6;if(hits>=need)pzEnd(true)}else{fc='#ff5a5a';pzMist()}});
 r.hintFn=()=>{zw*=1.5};r.cleanup=()=>cancelAnimationFrame(raf);draw();
 const t=document.createElement('div');t.style.cssText='font-size:11px;text-align:center;color:#9fb0c3';t.textContent=`Toque quando o marcador amarelo estiver na faixa verde (${need} acertos). Fora da faixa é erro.`;B.appendChild(t)}
// Câmera de segurança: ache as diferenças entre as duas imagens
function pzCam(B){const r=pzRun,s=r.s,N=[3,4,5][s-1],land=innerWidth>innerHeight*1.25,
  cw=Math.round(Math.max(130,Math.min(land?(innerWidth-60)/2:innerWidth*.9,land?innerHeight-170:(innerHeight-210)/2*1.45,340))),ch=Math.round(cw*.68),R=cw*.09;
 const M=[];for(let t=0;M.length<8+s*2&&t<300;t++){const q={x:.08+Math.random()*.84,y:.14+Math.random()*.72,z:.05+Math.random()*.03,t:Math.floor(Math.random()*3),h:Math.floor(Math.random()*360)};if(M.every(o=>Math.hypot((o.x-q.x)*cw,(o.y-q.y)*ch)>cw*.16))M.push(q)}
 const dif=shuf(M.map((_,i)=>i)).slice(0,Math.min(N,M.length)).map(i=>({i,k:pick(['cor','sumiu','moveu']),f:false}));
 const alt=M.map(o=>({...o}));dif.forEach(d=>{const o=alt[d.i];if(d.k==='cor')o.h=(o.h+140)%360;else if(d.k==='sumiu')o.gone=true;else o.x=o.x>.5?o.x-.14:o.x+.14});
 let hint=null,lastBad=0;const tm=[];
 const mkc=lab=>{const c=document.createElement('canvas');c.width=cw*2;c.height=ch*2;c.style.cssText=`width:${cw}px;height:${ch}px;border-radius:8px;border:2px solid #ffffff44;touch-action:manipulation`;const g=c.getContext('2d');g.scale(2,2);c.lab=lab;c.g=g;return c};
 const ca=mkc('ANTES • 21:04'),cb=mkc('DEPOIS • 21:19');
 const paint=(c,objs)=>{const g=c.g;g.fillStyle='#1d252d';g.fillRect(0,0,cw,ch);g.fillStyle='#2b3640';g.fillRect(0,ch*.64,cw,ch*.36);
  objs.forEach(o=>{if(o.gone)return;g.fillStyle=`hsl(${o.h},65%,52%)`;const x=o.x*cw,y=o.y*ch,z=o.z*cw;g.beginPath();if(o.t===0)g.rect(x-z,y-z,2*z,2*z);else if(o.t===1)g.arc(x,y,z,0,7);else{g.moveTo(x,y-z);g.lineTo(x+z,y+z);g.lineTo(x-z,y+z)}g.fill()});
  dif.forEach((d,k)=>{const o=M[d.i];if(d.f){g.strokeStyle='#3cd070';g.lineWidth=3;g.beginPath();g.arc(o.x*cw,o.y*ch,R,0,7);g.stroke()}
   else if(hint&&hint.k===k&&performance.now()<hint.t){g.strokeStyle='#ffe14a';g.lineWidth=2;g.beginPath();g.arc(o.x*cw,o.y*ch,R+3,0,7);g.stroke()}});
  g.fillStyle='#ffffffcc';g.font='bold 10px monospace';g.fillText('● REC  '+c.lab,6,12)};
 const info=document.createElement('div');info.style.cssText='font-size:11px;text-align:center;color:#9fb0c3;margin-top:4px';
 const render=()=>{paint(ca,M);paint(cb,alt);info.textContent=`Compare as imagens e toque nas diferenças: ${dif.filter(d=>d.f).length}/${dif.length}`};
 const tap=e=>{if(r.over)return;const q=e.currentTarget.getBoundingClientRect(),x=(e.clientX-q.left)*cw/q.width,y=(e.clientY-q.top)*ch/q.height;
  const f=dif.find(d=>!d.f&&(Math.hypot(x-M[d.i].x*cw,y-M[d.i].y*ch)<R||Math.hypot(x-alt[d.i].x*cw,y-alt[d.i].y*ch)<R));
  if(f){f.f=true;render();if(dif.every(d=>d.f))pzEnd(true)}else if(performance.now()-lastBad>400&&!dif.some(d=>d.f&&Math.hypot(x-M[d.i].x*cw,y-M[d.i].y*ch)<R)){lastBad=performance.now();pzMist()}};
 ca.addEventListener('pointerdown',tap);cb.addEventListener('pointerdown',tap);
 r.hintFn=()=>{const k=dif.findIndex(d=>!d.f);if(k<0)return;hint={k,t:performance.now()+6000};render();tm.push(setTimeout(render,6100))};
 r.cleanup=()=>tm.forEach(clearTimeout);
 const wrap=document.createElement('div');wrap.style.cssText=`display:flex;flex-direction:${land?'row':'column'};gap:6px;align-items:center`;wrap.append(ca,cb);B.append(wrap,info);render()}
