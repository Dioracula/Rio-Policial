function ctxUpdate(){const P=player.position;let a=null;
 if(!driving){
  if(inside==='hq'){
      if(Math.hypot(P.x-HQI.x,P.z-(HQI.z-10.7))<5)a={l:'MISSÕES',f:openMenu};
      else if(Math.hypot(P.x-(HQI.x-10),P.z-HQI.z)<5)a={l:'LOJA',f:openShop};
      else if(Math.hypot(P.x-HQI.x,P.z-(HQI.z+9))<4)a={l:'SAIR',f:()=>toWorld(HQD.x,-22)};
  }else if(Math.hypot(P.x-HQD.x,P.z-HQD.z)<3.5)a={l:'CENTRAL',f:()=>enterInt('hq')};
  else if(Math.hypot(P.x-(HQD.x-16),P.z-(HQD.z-10))<5)a={l:'OFICINA',f:openGarage};
  else if(victimN&&Math.hypot(P.x-victimN.mesh.position.x,P.z-victimN.mesh.position.z)<3.5)a={l:'FALAR',f:resolve};
 }
 $('xh').style.display=!aimOn||$('menu').style.display==='flex'?'none':'block';act=a;
 const b=$('ab');b.style.display=a?'block':'none';if(a)b.textContent=a.l
}

function loop(){
 requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.1);time+=dt;fc++;
 aimOn=aim&&(!driving||riding)&&!editApp;
 let ix=joy.x*(sens.joy||1),iy=joy.y*(sens.joy||1);
 if(keys.w)iy-=1;if(keys.s)iy+=1;if(keys.a)ix-=1;if(keys.d)ix+=1;
 if(editApp||riding){ix=iy=0}const len=Math.hypot(ix,iy),moving=len>.05;
 if(carHp<=0&&driving){cs=0;msg('Carro destruído!');leaveCar(true);}
 if(driving){
  const acc=Math.abs(iy)>.05?-iy:0;cs+=acc*22*dt;if(!acc)cs*=1-Math.min(1,2.5*dt);cs=Math.max(-8,Math.min(24,cs));
  ch-=ix*1.9*dt*Math.max(-1,Math.min(1,cs/6));
  const c=car.g,nx=c.position.x+Math.sin(ch)*cs*dt,nz=c.position.z+Math.cos(ch)*cs*dt;
  if(collides(nx,nz,1.6)||Math.abs(nx)>B||Math.abs(nz)>B){cs*=-.3;carHp-=Math.abs(cs)*0.8;hud();}else{c.position.x=nx;c.position.z=nz}
  c.rotation.y=ch;
  if(did===null&&Math.abs(cs)>2){let d=ch-yawT;d=Math.atan2(Math.sin(d),Math.cos(d));yawT+=d*Math.min(1,dt*2.5)}
 }else if(!riding&&moving){
  ix/=Math.max(len,1);iy/=Math.max(len,1);
  const mx=-ix*Math.cos(camYaw)-iy*Math.sin(camYaw),mz=ix*Math.sin(camYaw)-iy*Math.cos(camYaw),p=player.position;
  const spd=aimOn?3.4:7,nx=p.x+mx*spd*dt,nz=p.z+mz*spd*dt;const Z=ZB||{x0:-B,x1:B,z0:-B,z1:B};
  if(!collides(nx,p.z,.6))p.x=Math.max(Z.x0,Math.min(Z.x1,nx));if(!collides(p.x,nz,.6))p.z=Math.max(Z.z0,Math.min(Z.z1,nz));
  if(!aimOn){let d=Math.atan2(mx,mz)-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*12)}ph+=dt*(aimOn?5:9)
 }
 if(aimOn){let d=camYaw-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*16)}
 walk(pl.parts,ph,moving&&!driving);if(aimOn&&!riding)pl.parts.armR.rotation.x=-1.5;
 if(riding){const so=SEAT_OFF[riding]||SEAT_OFF[1],cy=car.g.rotation.y;
  player.position.set(car.g.position.x+so.x*Math.cos(cy)+so.z*Math.sin(cy),0,car.g.position.z-so.x*Math.sin(cy)+so.z*Math.cos(cy))}
 const P=pos(); near=null;let nd=3.4;
 for(const n of npcs){
  if(n.dead||n.arrested)continue;const p=n.mesh.position;
  const dp=Math.hypot(p.x-P.x,p.z-P.z);
  if(dp<nd&&!driving&&!riding&&!n.cop){nd=dp;near=n;}
 }
 const pr=$('prompt');if(near){pr.style.display='block';pr.textContent=near.victim?"Vítima do assalto":"Suspeito";}else pr.style.display='none';
 
 let cd=1e9;
 for(const c of clues){c.d.rotation.y+=dt*2;c.d.position.y=2.2+Math.sin(time*3)*.3;if(c.got)continue;
  const d=Math.hypot(c.m.position.x-P.x,c.m.position.z-P.z);
  if(d<2.8){c.got=true;scene.remove(c.m);notes.push(c.s);msg('Pista coletada!',1500);hud();if(roomCode)send({t:'clue',i:clues.indexOf(c)})}else cd=Math.min(cd,d)}
 cdist=cd;
 const on=Math.floor(time*6)%2;car.lights[0].material.color.set(on?0xff2222:0x330000);car.lights[1].material.color.set(on?0x112244:0x2266ff);
 const nc=Math.hypot(car.g.position.x-player.position.x,car.g.position.z-player.position.z)<4.5,cb=$('car');
 cb.style.display=(driving||riding||nc)?'block':'none';cb.textContent=(driving||riding)?'SAIR':(remoteDriver?'CARONA':'ENTRAR');
 $('arrest').style.opacity=(driving||riding)?.35:1;$('shoot').style.opacity=driving?.35:1;
 if(hp<=0){hp=100;if(driving)leaveCar(false);player.visible=true;toWorld(0,-8);cs=0;msg('Você foi derrubado!');}
 camUpdate(dt,P);ctxUpdate();updRemotes(dt);renderer.render(scene,camera);
}

// Multiplayer e Conexao
let aim=false,nick='',myKey='',friends=[],roomCode='',roomMembers=[],remotes={},playing=false,offline=false,ws=null,authRes=null,token=null,entering=false;
const okN=t=>/^[A-Za-z0-9_]{3,12}$/.test(t),sf=t=>String(t).replace(/[^\w]/g,'').slice(0,12);
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const remoteLooks={};let remoteXps={};let lookT=0,lastSendT=0,lsx=1e9,lsz=1e9,lsr=0;
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a)),carPos=()=>({x:+car.g.position.x.toFixed(2),z:+car.g.position.z.toFixed(2),r:+wrapA(car.g.rotation.y).toFixed(2),hp:+carHp.toFixed(2)});
token=ls('pc_token');
const SERVER=(()=>{let s=new URLSearchParams(location.search).get('server')||window.PC_SERVER||'';if(!s&&location.protocol.indexOf('http')===0)s=location.origin;return s.replace(/^http/,'ws').replace(/\/+$/,'')})();
function startSeeded(o,sd){const R0=Math.random;Math.random=seedR(sd>>>0);try{startMission(o)}finally{Math.random=R0}}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){return new Promise((res,rej)=>{if(!SERVER)return rej(new Error('sem servidor'));let w=new WebSocket(SERVER);w.onopen=()=>{ws=w;res()};w.onmessage=e=>{onMsg(JSON.parse(e.data))};w.onclose=()=>{ws=null;rej(new Error('fechado'))};})}
function waitAuth(){return new Promise(r=>{authRes=r;setTimeout(()=>r({ok:false,err:'Timeout'}),10000)})}
function nameTag(t,col){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='#000a';g.fillRect(0,0,256,64);g.fillStyle=col||'#7dff9a';g.font='bold 30px sans-serif';g.textAlign='center';g.fillText(t,128,44);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));sp.scale.set(2,.5,1);sp.position.y=2.9;return sp}
function retag(r){if(r.tag)r.g.remove(r.tag);const rSym=getRankSym(getLvl(r.xp||0));r.tag=nameTag(rSym+" "+r.nk+(r.stale?' ⚠':''),r.stale?'#ff9a9a':'#7dff9a');r.g.add(r.tag)}
function newRemote(n,x,z){const b=buildPerson({shirt:0x2e9e4f,pants:0x15233f,skin:0xe0b090,hat:true,hatColor:0x10224a,scale:1});scene.add(b.g);
 const r={g:b.g,parts:b.parts,nk:n,tx:+x||0,tz:+z||0,tr:0,vx:0,vz:0,lt:performance.now(),ph:0,drv:false,stale:false,tag:null,isRemote:true,xp:remoteXps[n.toLowerCase()]||0};
 applyLook(r,remoteLooks[n.toLowerCase()]);retag(r);b.g.position.set(r.tx,0,r.tz);return r}

function onMsg(m){switch(m.t){
 case 'auth':if(authRes)authRes(m);break;
 case 'friends':friends=m.list||[];break;
 case 'room':{roomCode=m.code||'';roomMembers=m.members||[];const low=roomMembers.map(x=>String(x).toLowerCase());
  for(const k in remotes)if(!low.includes(k)){scene.remove(remotes[k].g);delete remotes[k]}
  if(m.xps)for(const nn in m.xps)remoteXps[nn.toLowerCase()]=m.xps[nn];
  if(m.looks)for(const nn in m.looks){
      const k=nn.toLowerCase(),lk=cleanLook(m.looks[nn]);
      if(k!==myKey){
          remoteLooks[k]=lk;
          if(remotes[k]){remotes[k].xp=remoteXps[k]||0;applyLook(remotes[k],lk);retag(remotes[k]);}
      }
  }
  remoteDriver=(roomCode&&m.drv&&String(m.drv).toLowerCase()!==myKey)?String(m.drv):'';
  riderSeats=(m.riders||['','','']).map(String);
  if(riding&&String(riderSeats[riding-1]||'').toLowerCase()!==myKey){riding=0;player.visible=true}
  if(roomCode){if(m.car&&!driving&&Math.hypot(+m.car.x-car.g.position.x,+m.car.z-car.g.position.z)>(remoteDriver?8:.5))snapCar(m.car);
   if(driving){if(remoteDriver)leaveCar(true);else if(!m.drv)send({t:'drive',on:true})}}break}
 case 'ride':{if(m.ok){riding=+m.seat||1;driving=false;player.visible=false;yawT=camYaw=player.rotation.y=car.g.rotation.y;msg('Passageiro! Pode mirar!',2800)}break}
 case 'pres':{if(!roomCode)break;const k=m.n.toLowerCase();if(k===myKey)break;let r=remotes[k];if(!r)r=remotes[k]=newRemote(sf(m.n),m.x,m.z);
  r.tx=+m.x||0;r.tz=+m.z||0;r.tr=+m.r||0;r.vx=+m.u||0;r.vz=+m.w||0;r.lt=performance.now();r.drv=!!m.d;if(r.stale){r.stale=false;retag(r)}
  const inCar=(r.drv||riderSeats.map(s=>s.toLowerCase()).includes(k));
  if(inCar){r.g.visible=false;r.tag.position.set(car.g.position.x,3,car.g.position.z);}else{r.g.visible=true;r.tag.position.set(0,2.9,0);}
  break}
 case 'end':{mDone=true;score+=(+m.pts||0);xp+=(+m.pts*2||0);money+=(+m.pts*10||0);msg(String(m.text),3000);clearClues();notes=[];hud();break}
 case 'info':msg(String(m.s).slice(0,80),2200);break;
}}

function begin(){$('login').style.display='none';playing=true;$('soc').style.display='block';hud();msg('Bem-vindo, '+nick+'!',3500)}
function afterAuth(r){token=r.token;ls('pc_token',token);ls('pc_nick',r.nick);nick=r.nick;myKey=nick.toLowerCase();
 const sv=r.save;if(sv){score=sv.score||0;missionN=sv.missionN||0;money=sv.money||0;xp=sv.xp||0;weps=sv.weps||[1,0,0,0];eqWep=sv.eq||0;ammo=sv.ammo||0;armor=sv.arm||0;}
 setGunMesh(eqWep); if(sv&&sv.look){myLook=cleanLook(sv.look);applyLook(pl,myLook);}begin()}
async function enter(mode){
 if(entering)return;const n=$('nk').value.trim(),p=$('pw').value;entering=true;
 try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}
 if(mode==='off'){nick=n;offline=true;begin();return}
 try{
  $('lst').textContent='Conectando...';
  await connect();
  const cont=mode==='login'&&!p&&token&&n.toLowerCase()===String(ls('pc_nick')||'').toLowerCase();
  send(cont?{t:'resume',token}:{t:mode,nick:n,pass:p});
  const r=await waitAuth();
  if(!r.ok){$('lst').textContent=r.err;return}
  afterAuth(r);
 }finally{entering=false}}

function saveGame(force){if(!playing||offline)return;if(ws&&ws.readyState===1)send({t:'save',score,missionN,money,xp,weps,eq:eqWep,ammo,arm:armor})}

function sendPres(force){
 if(!roomCode||(roomMembers.length<2&&!driving)||!ws||ws.readyState!==1)return;
 const t=performance.now(),P=pos(),r=wrapA(driving?ch:player.rotation.y),dtp=(t-lastSendT)/1000;
 if(!force&&dtp<(driving?0.04:0.09))return;
 let u=0,w=0;if(dtp<1&&lsx<1e8){u=(P.x-lsx)/dtp;w=(P.z-lsz)/dtp;}
 lastSendT=t;lsx=P.x;lsz=P.z;lsr=r;
 send({t:'pres',x:+P.x.toFixed(2),z:+P.z.toFixed(2),r:+r.toFixed(2),u:+u.toFixed(2),w:+w.toFixed(2),d:driving?1:0,hp:+carHp.toFixed(2)})}

function updRemotes(dt){
 const now=performance.now(),f=1-Math.exp(-20*dt);
 for(const k in remotes){const r=remotes[k],p=r.g.position,age=(now-r.lt)/1000,ex=Math.min(age,.15);
  const gx=r.tx+r.vx*ex,gz=r.tz+r.vz*ex,dx=gx-p.x,dz=gz-p.z;
  if(Math.hypot(dx,dz)>14){p.x=gx;p.z=gz}else{p.x+=dx*f;p.z+=dz*f}
  const sp=dt>0?Math.hypot(dx,dz)*f/dt:0;r.ph+=dt*9;walk(r.parts,r.ph,sp>.8);
  r.g.rotation.y+=wrapA(r.tr-r.g.rotation.y)*Math.min(1,dt*14);
  const st=age>3;if(st!==r.stale){r.stale=st;retag(r)}
  if(r.drv&&!st){const c=car.g;c.position.x+=(gx-c.position.x)*f;c.position.z+=(gz-c.position.z)*f;c.rotation.y+=wrapA(r.tr-c.rotation.y)*Math.min(1,dt*18)}
 }
 sendPres()}

 $('mbox').innerHTML=`<b>👥 Menu e Amigos</b><br>
 <button data-a="save" style="background:#2ea043">Salvar</button>
