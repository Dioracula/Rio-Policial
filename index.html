 vk.forEach(id=>{const v=VESTS[id],d=Math.round(vests[id]);h+=`<div class="srow"><div class="si"><b>${v.n}</b> • ${Math.round(v.prot*100)}%<br><small>Durabilidade ${d}/${v.dur}</small></div><button class="${vestOn===id?'off':'ok'}" data-a="ev" data-n="${id}">${vestOn===id?'Tirar':'Vestir'}</button></div>`});
 $('mbox').innerHTML=h+'<button data-a="x" style="background:#444;text-align:center;margin-top:10px">Fechar</button>';$('menu').style.display='flex';$('mbox').scrollTop=st;if(!was)menuT=performance.now()}
function openShop(t){if(typeof t==='string')shopTab=t;plainMenu();curMenu='shop';const was=$('menu').style.display==='flex',st=$('mbox').scrollTop;
 let h='<b style="font-size:16px">🏪 Loja da Delegacia</b><div style="font-size:13px;margin:4px 0">💵 R$ '+money+'</div>'+[['w','🔫 Armas'],['a','📦 Munição'],['v','🦺 Coletes']].map(([k,n])=>`<button class="chip${shopTab===k?' on':''}" data-a="shop_t" data-n="${k}">${n}</button>`).join('');
 if(shopTab==='w')WEAPONS.forEach((w,id)=>{if(!id)return;const has=own.includes(id);h+=`<div class="srow"><div class="si"><b>${w.n}</b><br><small>${w.d} • dano ×${w.dmg} • ${w.range} m</small></div>`+(has?`<button class="${eq===id?'off':'ok'}" data-a="eq" data-n="${id}">${eq===id?'Equipada':'Equipar'}</button>`:`<button class="${money>=w.price?'ok':'off'}" data-a="bw" data-n="${id}">R$ ${w.price}</button>`)+'</div>'});
 else if(shopTab==='a'){if(own.length<2)h+='<div style="font-size:12px;color:#9fb0c3;margin-top:8px">Compre uma arma de fogo primeiro.</div>';
  own.forEach(id=>{if(!id)return;const w=WEAPONS[id],n=ammo[id]||0,full=n>=w.max;h+=`<div class="srow"><div class="si"><b>${w.n}</b><br><small>${n}/${w.max} • pacote de ${w.pack}</small></div><button class="${(!full&&money>=w.pp)?'ok':'off'}" data-a="ba" data-n="${id}">${full?'Cheia':'+'+w.pack+' • R$ '+w.pp}</button></div>`})}
 else VESTS.forEach((v,id)=>{const has=vests[id]!=null,d=Math.round(vests[id]||0),rc=has?Math.ceil(v.price*(1-d/v.dur)):0;
  h+=`<div class="srow"><div class="si"><b>${v.n}</b><br><small>Proteção ${Math.round(v.prot*100)}% • durabilidade ${has?d+'/':''}${v.dur}</small></div><div style="display:flex;flex-direction:column;gap:5px">`+(has?`<button class="${vestOn===id?'off':'ok'}" data-a="ev" data-n="${id}">${vestOn===id?'Equipado':'Equipar'}</button>`+(rc>0?`<button class="${money>=rc?'ok':'off'}" data-a="rv" data-n="${id}">Reparar R$ ${rc}</button>`:''):`<button class="${money>=v.price?'ok':'off'}" data-a="bv" data-n="${id}">R$ ${v.price}</button>`)+'</div></div>'});
 $('mbox').innerHTML=h+'<button data-a="x" style="background:#444;text-align:center;margin-top:10px">Fechar</button>';$('menu').style.display='flex';$('mbox').scrollTop=st;if(!was)menuT=performance.now()}
function refreshMenu(){if($('menu').style.display!=='flex')return;if(curMenu==='shop')openShop();else if(curMenu==='arsenal')openArsenal()}
function equip(id,q){if(!own.includes(id))return;eq=id;setHandWeapon(pl,id);updWpnBtn();hud();if(!q)msg(WEAPONS[id].n+' equipada',1200);saveGame();sendPres(true);refreshMenu()}
function buyW(id){const w=WEAPONS[id];if(!w||!id||own.includes(id))return;if(money<w.price)return msg('Dinheiro insuficiente',1500);
 money-=w.price;own.push(id);ammo[id]=w.pack;msg(w.n+' comprada! (+'+w.pack+' munições)',2200);equip(id,true);saveGame(true);openShop()}
function buyAmmo(id){const w=WEAPONS[id];if(!w||!id||!own.includes(id))return;if((ammo[id]||0)>=w.max)return msg('Munição cheia',1200);if(money<w.pp)return msg('Dinheiro insuficiente',1500);
 money-=w.pp;ammo[id]=Math.min(w.max,(ammo[id]||0)+w.pack);updWpnBtn();hud();saveGame(true);openShop()}
function buyV(id){const v=VESTS[id];if(!v||vests[id]!=null)return;if(money<v.price)return msg('Dinheiro insuficiente',1500);
 money-=v.price;vests[id]=v.dur;vestOn=id;setVest(pl,id);msg(v.n+' comprado e vestido!',2200);hud();saveGame(true);openShop()}
function equipV(id){if(vests[id]==null)return;vestOn=vestOn===id?-1:id;setVest(pl,vestOn);hud();saveGame();refreshMenu()}
function rechargeV(id){const v=VESTS[id];if(!v||vests[id]==null)return;const rc=Math.ceil(v.price*(1-vests[id]/v.dur));if(rc<=0)return;if(money<rc)return msg('Dinheiro insuficiente',1500);
 money-=rc;vests[id]=v.dur;msg(v.n+' reparado!',1800);hud();saveGame(true);openShop()}
function flushLook(){clearTimeout(lookT);ls('pc_look',myLook);if(!offline&&ws&&ws.readyState===1)send({t:'look',look:myLook})}
function lookChanged(){ls('pc_look',myLook);clearTimeout(lookT);lookT=setTimeout(flushLook,700)}
function openApp(){
 if(driving){msg('Saia da viatura para editar a aparência',2200);return}
 if(!editApp){edSave={y:yawT,p:pitchT};editApp=true;edZoom=false;yawT=camYaw=player.rotation.y+Math.PI;pitchT=camPitch=.1}
 document.body.classList.add('edit');$('menu').classList.add('ap');
 const st=$('mbox').scrollTop,L=myLook,hx=c=>'#'+c.toString(16).padStart(6,'0');
 const sw=(a,arr,cur)=>arr.map((c,i)=>`<button class="sw${i===cur?' on':''}" data-a="${a}" data-n="${i}" style="background:${hx(c)}"></button>`).join('');
 const chips=(a,names,cur)=>names.map((t,i)=>`<button class="chip${i===cur?' on':''}" data-a="${a}" data-n="${i}">${t}</button>`).join('');
 $('mbox').innerHTML='<b style="font-size:16px">🎨 Editar aparência</b><div style="font-size:11px;color:#9fb0c3;margin-top:2px">Uniforme e chapéu de policial continuam. Arraste a tela para girar.</div>'+
 '<div class="lbl">Cor da pele</div>'+sw('ap_skin',SKINS,L.skin)+
 '<div class="lbl">Cabelo</div>'+chips('ap_hair',HAIRN,L.hair)+
 (L.hair?'<div class="lbl">Cor do cabelo</div>'+sw('ap_hc',HAIRC,L.hc):'')+
 '<div class="lbl">Óculos</div>'+chips('ap_gl',GLN,L.glasses)+
 '<div class="lbl">Bigode</div>'+chips('ap_mu',MUN,L.must)+
 '<div class="lbl">Barba</div>'+chips('ap_be',BEN,L.beard)+
 (L.must||L.beard?'<div class="lbl">Cor da barba/bigode</div>'+sw('ap_fc',HAIRC,L.fc):'')+
 '<div class="lbl">Visão</div><button class="chip" data-a="ap_zoom">'+(edZoom?'🧍 Ver o corpo todo':'🔍 Zoom no rosto')+'</button><button class="chip" data-a="ap_rand">🎲 Aleatório</button><button class="chip" data-a="ap_reset">↺ Padrão</button>'+
 '<button data-a="ap_done" style="background:#2ea043;text-align:center;margin-top:14px">Pronto</button>';
 $('menu').style.display='flex';$('mbox').scrollTop=st}
function appAct(a,n){
 n=+n;
 if(a==='ap_done'){flushLook();$('menu').style.display='none';return}
 if(a==='ap_zoom'){edZoom=!edZoom;openApp();return}
 if(a==='ap_rand'){for(const k in LOOKMAX)myLook[k]=Math.floor(Math.random()*LOOKMAX[k])}
 else if(a==='ap_reset')myLook=cleanLook(null);
 else{const k={ap_skin:'skin',ap_hair:'hair',ap_hc:'hc',ap_gl:'glasses',ap_mu:'must',ap_be:'beard',ap_fc:'fc'}[a];if(!k||!(n>=0&&n<LOOKMAX[k]))return;myLook[k]=n}
 applyLook(pl,myLook);lookChanged();openApp()}
function socAct(a,n){
 if(a.slice(0,3)==='ap_')return appAct(a,n);
 if(a==='ap')return openApp();
 if(a==='fs')return toggleFS();if(a==='cfg')return openCfg();if(a==='cfg_reset'){cfg.joy=cfg.cam=cfg.aim=1;ls('pc_cfg',cfg);return openCfg()}
 if(a==='prof')return openProfile();if(a==='arsenal')return openArsenal();
 if(a==='shop_t')return openShop(n);
 if(a==='bw')return buyW(+n);if(a==='ba')return buyAmmo(+n);if(a==='bv')return buyV(+n);if(a==='ev')return equipV(+n);if(a==='rv')return rechargeV(+n);
 if(a==='eq')return equip(+n);
 if(a==='soc')return openSoc();
 if(a==='x'){$('menu').style.display='none';return}
 if(a==='rej'){send({t:'rej'});$('menu').style.display='none';return}
 if(a==='save'){saveGame(true);msg('Progresso salvo!',1500);return}
 if(a==='wipe'){wipe();return}
 if(a==='leave'){leaveRoom();openSoc();return}
 if(a==='del'){send({t:'fdel',nick:n});return}
 if(a==='add'){const f=$('fn').value.trim();if(!okN(f)||f.toLowerCase()===myKey)return msg('Nick inválido',1500);send({t:'fadd',nick:f});$('fn').value='';return}
 if(a==='inv'){send({t:'inv',nick:n,car:carPos()});return}
 if(a==='acc'){$('menu').style.display='none';send({t:'acc',host:n});return}
 if(a==='out'){send({t:'logout',token});ls('pc_token',null);noRecon=true;playing=false;setTimeout(()=>location.reload(),150)}}
$('lgo').onclick=()=>enter('login');$('lreg').onclick=()=>enter('reg');$('loff').onclick=()=>enter('off');
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')enter('login')});
$('soc').addEventListener('pointerdown',e=>{e.preventDefault();openMain()});
$('aimb').addEventListener('pointerdown',e=>{e.preventDefault();aim=!aim;$('aimb').style.background=aim?'#d29922':'#6e7681'});
setInterval(()=>{if(playing)saveGame()},30000);addEventListener('pagehide',()=>saveGame());
{const o=ls('pc_nick');if(o)$('nk').value=o;
 if(!SERVER)$('lst').textContent='Sem servidor: só modo offline.';
 else if(token&&o){$('lst').textContent='Entrando como '+o+'…';$('pw').placeholder='Senha (vazio = continuar)';$('lsw').style.display='block';
  $('lsw').onclick=()=>{noAuto=true;token=null;ls('pc_token',null);$('lsw').style.display='none';$('nk').value='';$('pw').placeholder='Senha (4–40 caracteres)';$('lst').textContent=''};
  setTimeout(()=>{if(!noAuto)enter('login')},300);
  addEventListener('pointerdown',()=>{try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}},{once:true})}}
genOffers();hud();loop();
</script></body></html>
