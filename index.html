 if(n.bar){n.bar.visible=en;if(en){const p=n.mesh.position,r=Math.max(.001,(n.hp==null?100:n.hp)/100),f=n.bar.userData.f;n.bar.position.set(p.x,n.mesh.scale.y*2.7+p.y,p.z);n.bar.quaternion.copy(camera.quaternion);f.scale.x=r;f.position.x=-.5*(1-r)}}}
 camUpdate(dt,P);if(aimOn&&(fc&3)===0)$('xh').style.borderColor=aimShot().tgt?'#ff5a5a':'#ffffffcc';
 sun.position.set(P.x+35,70,P.z+25);sun.target.position.set(P.x,0,P.z);
 gps();ctxUpdate();updRemotes(dt);renderer.render(scene,camera);
}

let aim=false,nick='',myKey='',friends=[],roomCode='',roomMembers=[],remotes={},playing=false,offline=false,lastPres=0,ws=null,authRes=null,reconT=null,noRecon=false,token=null,entering=false;
const okN=t=>/^[A-Za-z0-9_]{3,12}$/.test(t),okP=t=>t.length>=4&&t.length<=40,sf=t=>String(t).replace(/[^\w]/g,'').slice(0,12);
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const remoteLooks={};let lookT=0,lastSendT=0,lsx=1e9,lsz=1e9,lsr=0,wasMov=false;
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a)),carPos=()=>({x:+car.g.position.x.toFixed(2),z:+car.g.position.z.toFixed(2),r:+wrapA(car.g.rotation.y).toFixed(2)});
function plainMenu(){$('menu').classList.remove('ap')}
token=ls('pc_token');
// Endereço do servidor: o mesmo site que serviu a página (ou ?server=wss://... na URL)
const SERVER=(()=>{let s=new URLSearchParams(location.search).get('server')||window.PC_SERVER||'';if(!s&&location.protocol.indexOf('http')===0)s=location.origin;return s.replace(/^http/,'ws').replace(/\/+$/,'')})();
function startSeeded(o,sd){const R0=Math.random;Math.random=seedR(sd>>>0);try{startMission(o)}finally{Math.random=R0}}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){return new Promise((res,rej)=>{
 if(!SERVER)return rej(new Error('sem servidor'));
 let w;try{w=new WebSocket(SERVER)}catch(e){return rej(e)}
 const to=setTimeout(()=>{try{w.close()}catch(e){}rej(new Error('tempo esgotado'))},8000);
 w.onopen=()=>{clearTimeout(to);ws=w;res()};
 w.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}onMsg(m)};
 w.onerror=()=>{};
 w.onclose=()=>{clearTimeout(to);if(ws===w){ws=null;onClose()}rej(new Error('fechado'))}})}
function waitAuth(){return new Promise(r=>{authRes=r;setTimeout(()=>{if(authRes===r){authRes=null;r({ok:false,err:'O servidor não respondeu'})}},10000)})}
function clearRemotes(){for(const k in remotes){scene.remove(remotes[k].g);delete remotes[k]}}
function onClose(){roomCode='';roomMembers=[];remoteDriver='';pendingDrive=0;clearRemotes();
 if(authRes){const r=authRes;authRes=null;r({ok:false,err:'Conexão perdida'})}
 if(!playing||offline||noRecon)return;msg('Conexão perdida. Reconectando…',2500);tryRecon()}
function tryRecon(){if(reconT||offline||noRecon)return;reconT=setTimeout(async()=>{reconT=null;
 try{await connect();send({t:'resume',token});const r=await waitAuth();
  if(r.ok){friends=r.friends||[];saveGame(true);msg('Reconectado!',1500)}
  else if(r.expired){offline=true;msg('Sessão expirada. Continuando offline.',3500)}
  else tryRecon()}catch(e){tryRecon()}},3000)}
function menuIsSoc(){return $('menu').style.display==='flex'&&!!$('mbox').querySelector('[data-a=save]')}
function retag(r){if(r.tag)r.g.remove(r.tag);r.tag=nameTag(r.nk+(r.stale?' ⚠':''),r.stale?'#ff9a9a':'#7dff9a');r.g.add(r.tag)}
function newRemote(n,x,z){const b=buildPerson({shirt:0x2e9e4f,pants:0x15233f,skin:0xe0b090,hat:true,hatColor:0x10224a,scale:1});scene.add(b.g);
 const r={g:b.g,parts:b.parts,nk:n,tx:+x||0,tz:+z||0,tr:0,vx:0,vz:0,lt:performance.now(),ph:0,drv:false,stale:false,tag:null};
 applyLook(r,remoteLooks[n.toLowerCase()]);retag(r);b.g.position.set(r.tx,0,r.tz);return r}
function onMsg(m){switch(m.t){
 case 'auth':if(authRes){const r=authRes;authRes=null;r(m)}break;
 case 'friends':friends=m.list||[];if(menuIsSoc())openSoc();break;
 case 'invite':if(playing)showInvite({from:m.from,host:m.host});break;
 case 'room':{roomCode=m.code||'';roomMembers=m.members||[];const low=roomMembers.map(x=>String(x).toLowerCase());
  for(const k in remotes)if(!low.includes(k)){scene.remove(remotes[k].g);delete remotes[k]}
  if(m.looks)for(const nn in m.looks){const k=nn.toLowerCase(),lk=cleanLook(m.looks[nn]);if(k===myKey)continue;if(JSON.stringify(remoteLooks[k])!==JSON.stringify(lk)){remoteLooks[k]=lk;if(remotes[k])applyLook(remotes[k],lk)}}
  remoteDriver=(roomCode&&m.drv&&String(m.drv).toLowerCase()!==myKey)?String(m.drv):'';
  if(roomCode){if(m.car&&!driving&&Math.hypot(+m.car.x-car.g.position.x,+m.car.z-car.g.position.z)>(remoteDriver?8:.5))snapCar(m.car);
   if(driving){if(remoteDriver)leaveCar(true);else if(!m.drv)send({t:'drive',on:true})}}
  if(menuIsSoc())openSoc();break}
 case 'pres':{if(!roomCode||typeof m.n!=='string')break;const k=m.n.toLowerCase();if(k===myKey)break;let r=remotes[k];if(!r)r=remotes[k]=newRemote(sf(m.n),m.x,m.z);
  r.tx=+m.x||0;r.tz=+m.z||0;r.tr=+m.r||0;r.vx=+m.u||0;r.vz=+m.w||0;r.lt=performance.now();r.drv=!!m.d;if(r.stale){r.stale=false;retag(r)}break}
 case 'drv':{if(pendingDrive){pendingDrive=0;if(m.ok){if(!driving&&Math.hypot(car.g.position.x-player.position.x,car.g.position.z-player.position.z)<6)boardCar();else send({t:'drive',on:false})}}break}
 case 'mis':{if(!m.o||!TN[m.o.t])break;toWorld(HQD.x,-22);genOffers();startSeeded({t:m.o.t,s:Math.min(3,Math.max(1,+m.o.s||1))},+m.sd||1);msg(sf(m.from)+' iniciou uma missão da sala!',2500);break}
 case 'info':msg(String(m.s).slice(0,80),2200);break;
 case 'kicked':noRecon=true;offline=true;msg('Sua conta entrou em outro aparelho. Continuando offline.',4000);break}}
function begin(){$('login').style.display='none';playing=true;$('soc').style.display='block';hud();msg('Olá, '+nick+'! Vá à Central de Polícia (GPS).',3500)}
function afterAuth(r){token=r.token;ls('pc_token',token);ls('pc_nick',r.nick);nick=r.nick;myKey=nick.toLowerCase();friends=r.friends||[];
 score=(r.save&&r.save.score)||0;missionN=(r.save&&r.save.missionN)||0;lastSaved=score+':'+missionN;offline=false;noRecon=false;
 {const sl=r.save&&r.save.look;if(sl){myLook=cleanLook(sl);applyLook(pl,myLook);ls('pc_look',myLook)}else flushLook()}
 begin()}
async function enter(mode){
 if(entering)return;const n=$('nk').value.trim(),p=$('pw').value,L=$('lst');
 if(!okN(n)){L.textContent='Nick: 3–12 letras, números ou _';return}
 try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}
 if(mode==='off'){nick=n;myKey=n.toLowerCase();offline=true;ls('pc_nick',n);const sv=ls('pc_save');if(sv){score=sv.score||0;missionN=sv.missionN||0}begin();return}
 if(!SERVER){L.textContent='Servidor não configurado. Use "Jogar offline".';return}
 entering=true;
 try{
  const cont=mode==='login'&&!p&&token&&n.toLowerCase()===String(ls('pc_nick')||'').toLowerCase();
  if(!cont&&!okP(p)){L.textContent='Senha: 4 a 40 caracteres';return}
  L.textContent='Conectando…';
  let ok=false;for(let i=0;i<6&&!ok;i++){try{if(!ws||ws.readyState!==1)await connect();ok=true}catch(e){if(i<5)L.textContent='Acordando o servidor… (pode levar 1 min) '+(i+1)+'/6'}}
  if(!ok){L.textContent='Não consegui falar com o servidor. Tente de novo ou jogue offline.';return}
  send(cont?{t:'resume',token}:{t:mode==='reg'?'reg':'login',nick:n,pass:p});
  const r=await waitAuth();
  if(!r.ok){L.textContent=r.expired?'Sessão expirada. Digite a senha.':(r.err||'Erro ao entrar');if(r.expired){token=null;ls('pc_token',null)}return}
  $('pw').value='';afterAuth(r)
 }finally{entering=false}}
let lastSaved='';
function saveGame(force){if(!playing)return;if(offline){ls('pc_save',{score,missionN});return}const k=score+':'+missionN;if(!force&&k===lastSaved)return;if(ws&&ws.readyState===1){send({t:'save',score,missionN});lastSaved=k}}
function wipe(){if(!confirm('Apagar todo o seu progresso?'))return;score=0;missionN=0;if(offline)ls('pc_save',null);else send({t:'wipe'});lastSaved='0:0';hud();msg('Progresso apagado',2000)}
function nameTag(t,col){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='#000a';g.fillRect(0,0,256,64);g.fillStyle=col||'#7dff9a';g.font='bold 30px sans-serif';g.textAlign='center';g.fillText(t,128,44);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));sp.scale.set(2,.5,1);sp.position.y=2.9;return sp}
function leaveRoom(){send({t:'leave'});roomCode='';roomMembers=[];remoteDriver='';clearRemotes()}
// Presença: envia ~10x/s (relógio real) só quando se mexe, com velocidade; quem recebe extrapola e suaviza
function sendPres(force){
 if(!roomCode||(roomMembers.length<2&&!driving)||!ws||ws.readyState!==1)return;
 const t=performance.now(),P=pos(),r=wrapA(driving?ch:player.rotation.y),dtp=(t-lastSendT)/1000;
 if(!force&&dtp<.09)return;
 const mv=Math.hypot(P.x-lsx,P.z-lsz)>.03||Math.abs(wrapA(r-lsr))>.04;
 if(!force&&!mv&&!wasMov&&dtp<1)return;
 let u=0,w=0;if(mv&&dtp<1&&lsx<1e8){u=(P.x-lsx)/dtp;w=(P.z-lsz)/dtp;const l=Math.hypot(u,w);if(l>40){u*=40/l;w*=40/l}}
 lastSendT=t;lsx=P.x;lsz=P.z;lsr=r;wasMov=mv;
 send({t:'pres',x:+P.x.toFixed(2),z:+P.z.toFixed(2),r:+r.toFixed(2),u:+u.toFixed(2),w:+w.toFixed(2),d:driving?1:0})}
function updRemotes(dt){
 const now=performance.now(),f=1-Math.exp(-15*dt);
 for(const k in remotes){const r=remotes[k],p=r.g.position,age=(now-r.lt)/1000,ex=Math.min(age,.22);
  const gx=r.tx+r.vx*ex,gz=r.tz+r.vz*ex,dx=gx-p.x,dz=gz-p.z;
  if(Math.hypot(dx,dz)>14){p.x=gx;p.z=gz}else{p.x+=dx*f;p.z+=dz*f}
  const sp=dt>0?Math.hypot(dx,dz)*f/dt:0;r.ph+=dt*9;walk(r.parts,r.ph,sp>.8);
  r.g.rotation.y+=wrapA(r.tr-r.g.rotation.y)*Math.min(1,dt*14);
  const st=age>3;if(st!==r.stale){r.stale=st;retag(r)}
  if(r.drv&&!st){r.g.visible=false;const c=car.g;c.position.x+=(gx-c.position.x)*f;c.position.z+=(gz-c.position.z)*f;c.rotation.y+=wrapA(r.tr-c.rotation.y)*Math.min(1,dt*12)}else r.g.visible=true}
 sendPres()}
function showInvite(d){plainMenu();$('mbox').innerHTML=`<b>✉ ${sf(d.from)} convidou você para a sala dele</b><button data-a="acc" data-n="${sf(d.host)}">Aceitar</button><button data-a="rej" style="background:#444">Recusar</button>`;$('menu').style.display='flex';menuT=performance.now()}

 (offline?'<div style="font-size:12px;color:#ffe9a8">Offline: amigos e salas indisponíveis.</div>':`<input id="fn" placeholder="Nick do amigo" maxlength="12" autocapitalize="off" style="width:100%;margin-top:8px"><button data-a="add">Adicionar amigo</button>`+friends.map(f=>`<div style="display:flex;gap:6px"><button data-a="inv" data-n="${f.n}">${f.on?'🟢':'⚫'} Convidar ${f.n}</button><button data-a="del" data-n="${f.n}" style="width:48px;background:#555;text-align:center">✕</button></div>`).join(''))+

function appAct(a,n){
 n=+n;
 if(a==='ap_done'){flushLook();$('menu').style.display='none';return}

 if(a==='ap_rand'){for(const k in LOOKMAX)myLook[k]=Math.floor(Math.random()*LOOKMAX[k])}

 else{const k={ap_skin:'skin',ap_hair:'hair',ap_hc:'hc',ap_gl:'glasses',ap_mu:'must',ap_be:'beard',ap_fc:'fc'}[a];if(!k||!(n>=0&&n<LOOKMAX[k]))return;myLook[k]=n}

{const o=ls('pc_nick');if(o)$('nk').value=o;
