<script>

// ---------- Cidade ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x2e2f33));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const colliders=[];let BK=null;

 for(let x=0;x<2;x++)for(let y=0;y<2;y++){g.fillStyle=Math.random()<.35?'#ffe9a8':'#2a3a4a';g.fillRect(8+x*28,8+y*28,18,18)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t}
const roofMat=mat(0x555555),slabMat=mat(0x9a9a95),lineMat=new THREE.MeshBasicMaterial({color:0xd8c84a});
for(let k=-6;k<=5;k++){const p=k*32+16;

const BASES=['#8a96a3','#a89684','#7f9aa8','#b0a08a'];const BLD=[],BN=['cinza','marrom','azul','bege'],BKS=[],LMS=[],LM=[{n:'Hospital',i:-4,j:-2,c:0xe8e8f0},{n:'Mercado',i:3,j:3,c:0x6fbf73},{n:'Escola',i:-1,j:5,c:0xe0b44a}],TOLD=[{n:'vermelho',c:0xc03a3a},{n:'verde',c:0x2f9f4f},{n:'azul',c:0x2f5fcf},{n:'amarelo',c:0xe5c32b}];
function landmark(cx,cz,name,col){const m=new THREE.Mesh(new THREE.BoxGeometry(18,10,14),mat(col));m.position.set(cx,5.1,cz);m.castShadow=m.receiveShadow=true;scene.add(m);colliders.push({x:cx,z:cz,w:18,d:14});const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='#222';g.fillRect(0,0,256,64);g.fillStyle='#fff';g.font='bold 38px sans-serif';g.textAlign='center';g.fillText(name,128,46);const sg=new THREE.Mesh(new THREE.PlaneGeometry(10,2.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)}));sg.position.set(cx,7,cz+7.05);scene.add(sg)}
for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++){
 const cx=i*32,cz=j*32;
 const slab=new THREE.Mesh(new THREE.BoxGeometry(24,.1,24),slabMat);slab.position.set(cx,.05,cz);slab.receiveShadow=true;scene.add(slab);
 if(!i&&!j){const s=new THREE.Mesh(new THREE.CylinderGeometry(2.5,3,1.2,16),mat(0x777777));s.position.set(0,.7,0);s.castShadow=true;scene.add(s);colliders.push({x:0,z:0,w:6,d:6});continue}
 if((i===2&&j===-1)||(i===-3&&j===3)||(i===4&&j===-4)){BKS.push({x:cx,z:cz,w:16,d:14});BK=BKS[0];
  const bb=new THREE.Mesh(new THREE.BoxGeometry(16,9,14),mat(0xd9cfae));bb.position.set(cx,4.6,cz);bb.castShadow=bb.receiveShadow=true;scene.add(bb);colliders.push({x:cx,z:cz,w:16,d:14});
  const sc=document.createElement('canvas');sc.width=256;sc.height=64;const g=sc.getContext('2d');g.fillStyle='#14305c';g.fillRect(0,0,256,64);g.fillStyle='#ffd24a';g.font='bold 44px sans-serif';g.textAlign='center';g.fillText('BANCO',128,48);
  const sg=new THREE.Mesh(new THREE.PlaneGeometry(10,2.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc)}));sg.position.set(cx,6.5,cz-7.05);sg.rotation.y=Math.PI;scene.add(sg);
  const dr=new THREE.Mesh(new THREE.BoxGeometry(3,4,.2),mat(0x2a1f12));dr.position.set(cx,2.1,cz-7.05);scene.add(dr);
  [-6,-2,2,6].forEach(o=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,8,10),mat(0xf0ece0));c.position.set(cx+o,4.1,cz-8.2);c.castShadow=true;scene.add(c)});
  const rf=new THREE.Mesh(new THREE.BoxGeometry(17,.6,2.8),mat(0xbdb596));rf.position.set(cx,8.5,cz-8);scene.add(rf);continue}
 {const lm=LM.find(l=>l.i===i&&l.j===j);if(lm){landmark(cx,cz,lm.n,lm.c);LMS.push({x:cx,z:cz,n:lm.n,c:lm.c});continue}}
 if(i===0&&j===-1){const hb=new THREE.Mesh(new THREE.BoxGeometry(18,10,14),mat(0x2b4a8a));hb.position.set(cx,5.1,cz);hb.castShadow=hb.receiveShadow=true;scene.add(hb);colliders.push({x:cx,z:cz,w:18,d:14});
  const sc=document.createElement('canvas');sc.width=256;sc.height=64;const g=sc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,256,64);g.fillStyle='#14305c';g.font='bold 40px sans-serif';g.textAlign='center';g.fillText('POLÍCIA',128,48);
  const sg=new THREE.Mesh(new THREE.PlaneGeometry(10,2.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc)}));sg.position.set(cx,7,cz+7.05);scene.add(sg);
  const dr=new THREE.Mesh(new THREE.BoxGeometry(3,4,.3),mat(0x10224a));dr.position.set(cx,2.1,cz+7.1);scene.add(dr);continue}
 const w=12+Math.random()*7,d=12+Math.random()*7,h=8+Math.random()*(Math.random()<.25?30:16),base=pick(BASES),tc=pick(TOLD),ant=Math.random()<.4;
 const mW=new THREE.MeshLambertMaterial({map:winTex(base,w/4,h/4)}),mD=new THREE.MeshLambertMaterial({map:winTex(base,d/4,h/4)});
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mD,mD,roofMat,roofMat,mW,mW]);b.position.set(cx,h/2+.1,cz);b.castShadow=b.receiveShadow=true;scene.add(b);
 colliders.push({x:cx,z:cz,w,d});BLD.push({x:cx,z:cz,w,d,h,cor:BN[BASES.indexOf(base)],toldo:tc.n,ant});
 {const dm=new THREE.Mesh(new THREE.BoxGeometry(2.4,3.2,.3),mat(0x3b2a1a));dm.position.set(cx,1.7,cz+d/2+.1);scene.add(dm);const aw=new THREE.Mesh(new THREE.BoxGeometry(3.6,.3,1.6),mat(tc.c));aw.position.set(cx,3.5,cz+d/2+.8);scene.add(aw);if(ant){const a=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,5,6),mat(0x222222));a.position.set(cx+w/4,h+2.6,cz);scene.add(a)}}
 const tx=cx+(Math.random()<.5?-11:11),tz=cz+(Math.random()<.5?-11:11);
 const tr=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,2,6),mat(0x5a3d22));tr.position.set(tx,1,tz);scene.add(tr);
 const lf=new THREE.Mesh(new THREE.ConeGeometry(1.6,3.6,8),mat(0x2f7d3a));lf.position.set(tx,3.6,tz);lf.castShadow=true;scene.add(lf);
 colliders.push({x:tx,z:tz,w:1,d:1});
}

Math.random=_R0;
// ---------- Pessoas ----------
const COLORS={vermelha:0xcc2b2b,azul:0x2b5fcc,verde:0x2e9e4f,amarela:0xe5c32b,preta:0x222222,branca:0xeeeeee,roxa:0x7b3fb5,laranja:0xe8832a};
const CK=Object.keys(COLORS),HK=['baixo','médio','alto'],HS={baixo:.88,médio:1,alto:1.13},HT={baixo:'baixa',médio:'média',alto:'alta'};
const PANTS=[0x2b3a55,0x3d3d3d,0x5a4632,0x1f1f1f],SKIN=[0xf1c9a5,0xd9a27a,0xa97550,0x7a5236],HATC=[0x333333,0x2b5fcc,0xcc2b2b,0x2e9e4f];
function buildPerson(o){
 const g=new THREE.Group();
 const add=(geo,m,x,y,z,par)=>{const me=new THREE.Mesh(geo,m);me.position.set(x,y,z);me.castShadow=true;(par||g).add(me);return me};
 const sm=mat(o.shirt),pm=mat(o.pants);
 add(new THREE.BoxGeometry(.7,.9,.4),sm,0,1.35,0);
 add(new THREE.SphereGeometry(.26,12,10),mat(o.skin),0,2,0).userData.p='h';
 const mk=(x,y,geo,m,oy)=>{const p=new THREE.Group();p.position.set(x,y,0);add(geo,m,0,oy,0,p);g.add(p);return p};
 const legL=mk(-.18,.9,new THREE.BoxGeometry(.3,.9,.32),pm,-.45),legR=mk(.18,.9,new THREE.BoxGeometry(.3,.9,.32),pm,-.45);
 const armL=mk(-.46,1.75,new THREE.BoxGeometry(.2,.8,.22),sm,-.4),armR=mk(.46,1.75,new THREE.BoxGeometry(.2,.8,.22),sm,-.4);legL.children[0].userData.p=legR.children[0].userData.p='l';armL.children[0].userData.p=armR.children[0].userData.p='a';
 if(o.hat){const hm=mat(o.hatColor);add(new THREE.CylinderGeometry(.28,.28,.12,12),hm,0,2.22,0).userData.p='h';add(new THREE.BoxGeometry(.3,.04,.25),hm,0,2.17,.25)}
 if(o.pack)add(new THREE.BoxGeometry(.5,.6,.22),mat(0x4b3a2a),0,1.4,-.3);
 g.scale.setScalar(o.scale||1);
 return{g,parts:{legL,legR,armL,armR,sm}};
}
function walk(p,ph,on){const a=on?Math.sin(ph)*.7:0;p.legL.rotation.x=a;p.legR.rotation.x=-a;p.armL.rotation.x=-a;p.armR.rotation.x=a}

const player=pl.g;player.position.set(0,0,-8);scene.add(player);
const gun=new THREE.Mesh(new THREE.BoxGeometry(.08,.12,.5),mat(0x111111));gun.position.set(0,-.75,.3);pl.parts.armR.add(gun);
function buildCar(c,police){const g=new THREE.Group();

 ad(new THREE.BoxGeometry(2,.7,4.4),mat(c),0,.75,0);ad(new THREE.BoxGeometry(1.7,.6,2.2),mat(police?0x223355:0x111111),0,1.35,-.2);
 const wm=mat(0x111111);[[-1,1.4],[1,1.4],[-1,-1.4],[1,-1.4]].forEach(([x,z])=>{ad(new THREE.CylinderGeometry(.4,.4,.3,10),wm,x,.4,z).rotation.z=Math.PI/2});
 let lights=null;if(police)lights=[ad(new THREE.BoxGeometry(.5,.15,.3),new THREE.MeshBasicMaterial({color:0xff2222}),-.4,1.72,-.2),ad(new THREE.BoxGeometry(.5,.15,.3),new THREE.MeshBasicMaterial({color:0x2266ff}),.4,1.72,-.2)];
 return{g,lights}}

const npcs=[];
function freePos(r){let x,z,t=0;do{x=(Math.random()-.5)*300;z=(Math.random()-.5)*300;t++}while(collides(x,z,r)&&t<60);return[x,z]}
function model(n){
 const t=n.traits,r=buildPerson({shirt:COLORS[t.cor],pants:n.pants,skin:n.skin,hat:t.bone,hatColor:n.hatC,pack:t.mochila,scale:HS[t.altura]});

function spawnNPC(pos,ex){

 const n=Object.assign({traits:{cor:pick(CK),bone:Math.random()<.4,mochila:Math.random()<.4,altura:pick(HK)},pants:pick(PANTS),skin:pick(SKIN),hatC:pick(HATC),
  isSuspect:false,dead:false,arrested:false,t0:0,tgt:new THREE.Vector3(x,0,z),timer:0,ph:Math.random()*6,fireT:1},ex||{});
 model(n);n.mesh.position.set(x,0,z);npcs.push(n);return n}
{const R0=Math.random;Math.random=seedR(777);for(let i=0;i<70;i++)spawnNPC();Math.random=R0}
const desc=t=>`Camisa ${t.cor} • ${t.bone?'Boné':'Sem boné'} • ${t.mochila?'Mochila':'Sem mochila'} • ${t.altura}`;

const CRIMES=['roubo','homicídio','tráfico de drogas'];
const pos=()=>driving?car.g.position:player.position;

function hud(){
 const P=pos();let h='Vá à <b>Central de Polícia</b> (siga o GPS) e escolha uma missão.';
 if(!mDone){
  if(mtype==='bank'){const al=robbers.filter(r=>!r.dead&&!r.arrested).length;
   h=phase==='wait'?`<b>Missão ${missionN} ${'★'.repeat(mStars)}:</b> assalto ao <b>banco</b>! ⏱ ${Math.ceil(timeLeft)}s • ${Math.round(Math.hypot(BK.x-P.x,BK.z-P.z))}m<br>Criminosos: ${al}`:'<b>Fuga!</b> Bloqueie o carro com a viatura!'}
  else if(mtype==='kid')h=`<b>Missão ${missionN} ${'★'.repeat(mStars)}:</b> <b>sequestro</b> ⏱ ${Math.ceil(timeLeft)}s<br>`+(inside==='kid'?'Salve o refém! Cuidado com os tiros.':`Pistas: ${notes.length}/${mtotal}. Ache o prédio e entre pela porta.`)
  else h=`<b>Missão ${missionN} ${'★'.repeat(mStars)}:</b> suspeito de <b>${crime}</b>.<br>Pistas: ${notes.length}/${mtotal}`+(cdist<1e8?` • mais próxima: ${Math.round(cdist)}m`:'')+(crime==='homicídio'&&!notes.length?'<br>Há um corpo com pista na cidade.':'')}
 $('mission').innerHTML=h;
 $('notes').innerHTML=mtype==='bank'&&!mDone?'🚓 Use a viatura (ENTRAR) e vá ao feixe vermelho. Os armados atiram!':notes.length?notes.map(n=>'📌 '+n).join('<br>'):mDone?'🚓 Siga o GPS até a Central de Polícia.':'Siga o GPS até o local do crime e colete as pistas.';

function endMission(win,text,pts=0){if(mDone)return;mDone=true;pts*=mStars;score+=pts;if(pts)text+=` ×${mStars}★ = +${pts}`;if(suspect){suspect.isSuspect=false;suspect.armed=false;suspect=null}msg(text,3000);endKid();clearClues();notes=[];if(bankBeam){scene.remove(bankBeam);bankBeam=null}genOffers();hud();saveGame()}
function neutralize(n,kind,dl){

let aim=false,nick='',myKey='',friends=[],roomCode='',roomMembers=[],remotes={},playing=false,offline=false,lastPres=0,ws=null,authRes=null,reconT=null,noRecon=false,token=null,entering=false;

function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
token=ls('pc_token');
// Endereço do servidor: o mesmo site que serviu a página (ou ?server=wss://... na URL)
const SERVER=(()=>{let s=new URLSearchParams(location.search).get('server')||window.PC_SERVER||'';if(!s&&location.protocol.indexOf('http')===0)s=location.origin;return s.replace(/^http/,'ws').replace(/\/+$/,'')})();

function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function connect(){return new Promise((res,rej)=>{
 if(!SERVER)return rej(new Error('sem servidor'));

 w.onclose=()=>{clearTimeout(to);if(ws===w){ws=null;onClose()}rej(new Error('fechado'))}})}
function waitAuth(){return new Promise(r=>{authRes=r;setTimeout(()=>{if(authRes===r){authRes=null;r({ok:false,err:'O servidor não respondeu'})}},10000)})}

function onClose(){roomCode='';roomMembers=[];clearRemotes();
 if(authRes){const r=authRes;authRes=null;r({ok:false,err:'Conexão perdida'})}
 if(!playing||offline||noRecon)return;msg('Conexão perdida. Reconectando…',2500);tryRecon()}
function tryRecon(){if(reconT||offline||noRecon)return;reconT=setTimeout(async()=>{reconT=null;

  if(r.ok){friends=r.friends||[];saveGame(true);msg('Reconectado!',1500)}
  else if(r.expired){offline=true;msg('Sessão expirada. Continuando offline.',3500)}
  else tryRecon()}catch(e){tryRecon()}},3000)}
function menuIsSoc(){return $('menu').style.display==='flex'&&!!$('mbox').querySelector('[data-a=save]')}
function newRemote(n,x,z){const b=buildPerson({shirt:0x2e9e4f,pants:0x15233f,skin:0xe0b090,hat:true,hatColor:0x10224a,scale:1});scene.add(b.g);b.g.add(nameTag(n));b.g.position.set(+x||0,0,+z||0);return{g:b.g,nk:n,parts:b.parts,tx:+x||0,tz:+z||0,ph:0,tr:0}}
function onMsg(m){switch(m.t){
 case 'auth':if(authRes){const r=authRes;authRes=null;r(m)}break;
 case 'friends':friends=m.list||[];if(menuIsSoc())openSoc();break;
 case 'invite':if(playing)showInvite({from:m.from,host:m.host});break;
 case 'room':{roomCode=m.code||'';roomMembers=m.members||[];const low=roomMembers.map(x=>String(x).toLowerCase());
  for(const k in remotes)if(!low.includes(k)){scene.remove(remotes[k].g);delete remotes[k]}
  if(menuIsSoc())openSoc();break}

 case 'mis':{if(!m.o||!TN[m.o.t])break;toWorld(HQD.x,-22);genOffers();startSeeded({t:m.o.t,s:Math.min(3,Math.max(1,+m.o.s||1))},+m.sd||1);msg(sf(m.from)+' iniciou uma missão da sala!',2500);break}
 case 'info':msg(String(m.s).slice(0,80),2200);break;

function begin(){$('login').style.display='none';playing=true;$('soc').style.display='block';hud();msg('Olá, '+nick+'! Vá à Central de Polícia (GPS).',3500)}
function afterAuth(r){token=r.token;ls('pc_token',token);ls('pc_nick',r.nick);nick=r.nick;myKey=nick.toLowerCase();friends=r.friends||[];

async function enter(mode){
 if(entering)return;const n=$('nk').value.trim(),p=$('pw').value,L=$('lst');
 if(!okN(n)){L.textContent='Nick: 3–12 letras, números ou _';return}
 try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}
 if(mode==='off'){nick=n;myKey=n.toLowerCase();offline=true;ls('pc_nick',n);const sv=ls('pc_save');if(sv){score=sv.score||0;missionN=sv.missionN||0}begin();return}
 if(!SERVER){L.textContent='Servidor não configurado. Use "Jogar offline".';return}
 entering=true;
 try{
  const cont=mode==='login'&&!p&&token&&n.toLowerCase()===String(ls('pc_nick')||'').toLowerCase();
  if(!cont&&!okP(p)){L.textContent='Senha: 4 a 40 caracteres';return}
  L.textContent='Conectando…';
  let ok=false;for(let i=0;i<6&&!ok;i++){try{if(!ws||ws.readyState!==1)await connect();ok=true}catch(e){if(i<5)L.textContent='Acordando o servidor… (pode levar 1 min) '+(i+1)+'/6'}}
  if(!ok){L.textContent='Não consegui falar com o servidor. Tente de novo ou jogue offline.';return}
  send(cont?{t:'resume',token}:{t:mode==='reg'?'reg':'login',nick:n,pass:p});
  const r=await waitAuth();
  if(!r.ok){L.textContent=r.expired?'Sessão expirada. Digite a senha.':(r.err||'Erro ao entrar');if(r.expired){token=null;ls('pc_token',null)}return}
  $('pw').value='';afterAuth(r)
 }finally{entering=false}}
